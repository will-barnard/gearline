# Shared proxy settings, included by every location block in nginx.conf.
#
# Kept in one file so a change (a header, a timeout) applies to both backends
# at once and the two cannot drift apart during the strangler cutover.
#
# `$upstream` is set by the including location block. proxy_pass MUST use the
# variable form so nginx resolves the hostname per request via the embedded DNS
# resolver rather than at config load time — otherwise nginx refuses to start
# whenever a backend container isn't up yet.

proxy_pass $upstream;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Do not buffer request bodies to disk. Shopify webhook HMACs are computed over
# the exact bytes sent; buffering is safe for correctness but adds latency on
# the hot path, and streaming keeps the raw body intact end to end.
proxy_request_buffering off;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;

# ── proxy_read_timeout is deliberately NOT set here ──────────────────────────
#
# nginx rejects a duplicate directive in the same context. Several location
# blocks need a longer read timeout than the default (catalogue paging, CSV
# export), and setting it here as well as there is a hard config error:
#
#   [emerg] "proxy_read_timeout" directive is duplicate
#
# nginx refuses to start, so the frontend container crash-loops.
#
# EVERY location block that includes this file must therefore set
# proxy_read_timeout itself. There is no inherited default to fall back on.
