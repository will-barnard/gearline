server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolution must happen at request time, not at
    # config load, or nginx crashes on startup when the backend isn't up yet.
    # ipv6=off is required — without it AAAA lookups return SERVFAIL.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ─────────────────────────────────────────────────────────────────────────
    # ALL API TRAFFIC NOW GOES TO THE NODE BACKEND.
    #
    # The Java service is fully superseded. To roll ANY route back to it,
    # add a more specific location block above the general ones, e.g.:
    #
    #     location ~ ^/api/v1/products/[^/]+/resync-from-shopify$ {
    #         set $upstream http://backend:8080;
    #         include /etc/nginx/proxy-common.conf;
    #     }
    #
    # nginx evaluates regex locations before plain prefixes, and `^~` prefixes
    # before regex — so a targeted block always wins over the catch-alls below.
    # This is why the Java service should stay deployed for a week or two after
    # cutover even though nothing routes to it.
    # ─────────────────────────────────────────────────────────────────────────

    # ── Long-running operations ──────────────────────────────────────────────
    # These page through an entire Shopify catalogue. They return quickly
    # (202 / streamed), but the upstream work is slow enough to warrant headroom.

    location ^~ /api/v1/products/bulk-resync-skus-from-shopify {
        set $upstream http://backend:3001;
        include /etc/nginx/proxy-common.conf;
        proxy_read_timeout 300s;
    }

    location ~ ^/api/v1/products/[^/]+/resync-from-shopify$ {
        set $upstream http://backend:3001;
        include /etc/nginx/proxy-common.conf;
        proxy_read_timeout 120s;
    }

    # Connector-backed account operations — these call live marketplace APIs.
    location ~ ^/api/v1/marketplace/accounts/[^/]+/(ebay/|reverb/|health-check|sync-products) {
        set $upstream http://backend:3001;
        include /etc/nginx/proxy-common.conf;
        proxy_read_timeout 120s;
    }

    # CSV export streams the whole catalogue.
    location ^~ /api/v1/products/export.csv {
        set $upstream http://backend:3001;
        include /etc/nginx/proxy-common.conf;
        proxy_read_timeout 300s;
        # Streamed response — buffering would hold the entire CSV in memory
        # and delay the download until the last row.
        proxy_buffering off;
    }

    # ── Webhooks ─────────────────────────────────────────────────────────────
    # Unauthenticated; authenticity comes from the Shopify HMAC over the raw
    # body. Shopify retries anything that is not 2xx within 5s, so the handler
    # acknowledges immediately and processes detached.

    location ^~ /webhooks/ {
        set $upstream http://backend:3001;
        include /etc/nginx/proxy-common.conf;
        proxy_read_timeout 30s;
    }

    # ── Everything else under /api/ ──────────────────────────────────────────
    # Includes OAuth handshakes and the eBay notifications endpoint, which are
    # unauthenticated by design and guarded by HMAC / nonce / challenge instead.

    location ^~ /api/ {
        set $upstream http://backend:3001;
        include /etc/nginx/proxy-common.conf;
    }

    # ── Static assets ────────────────────────────────────────────────────────

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all remaining routes handled by Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
