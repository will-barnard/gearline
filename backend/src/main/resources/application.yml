spring:
  application:
    name: gearline

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gearline}
    username: ${SPRING_DATASOURCE_USERNAME:gearline}
    password: ${SPRING_DATASOURCE_PASSWORD:gearline}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 2

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:gearline}
    password: ${SPRING_RABBITMQ_PASSWORD:gearline}
    listener:
      simple:
        prefetch: 5
        default-requeue-rejected: false
        retry:
          enabled: false  # Handled manually with exponential backoff

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

gearline:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-64-char-secret-key-here-ok}
    access-token-expiry-ms: 28800000   # 8 hours
    refresh-token-expiry-ms: 604800000  # 7 days

  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}

  credential:
    # AES-256-GCM key for encrypting marketplace OAuth tokens at rest.
    # Generate with: openssl rand -base64 32
    # If blank, credentials are stored as plain JSON (dev mode — NOT for production).
    encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:}

  shopify:
    client-id: ${SHOPIFY_CLIENT_ID:}
    client-secret: ${SHOPIFY_CLIENT_SECRET:}
    scopes: read_products,write_products,read_inventory,write_inventory,read_orders,write_orders,read_fulfillments,write_fulfillments
    # Shopify Flows "Send HTTP Request" — static token auth (not HMAC).
    # Set SHOPIFY_FLOW_SECRET to the token you configure in your Flow.
    # Set SHOPIFY_FLOW_TOKEN_HEADER if you use a custom header name (default: X-Shopify-Flow-Token).
    flow-secret: ${SHOPIFY_FLOW_SECRET:}
    flow-token-header: ${SHOPIFY_FLOW_TOKEN_HEADER:X-Shopify-Flow-Token}

  reverb:
    client-id: ${REVERB_CLIENT_ID:}
    client-secret: ${REVERB_CLIENT_SECRET:}
    api-base-url: https://reverb.com/api
    auth-url: https://reverb.com/oauth

  ebay:
    client-id: ${EBAY_CLIENT_ID:}
    client-secret: ${EBAY_CLIENT_SECRET:}
    api-base-url: https://api.ebay.com
    auth-url: https://auth.ebay.com/oauth2
    # RuName (Redirect URL Name) assigned by the eBay Developer Portal.
    # Register your callback URL there, then copy the RuName shown.
    ru-name: ${EBAY_RU_NAME:}

  sync:
    max-retry-attempts: 5
    initial-retry-delay-ms: 1000
    max-retry-delay-ms: 300000  # 5 minutes

  queue:
    sync-exchange: gearline.sync
    sync-queue: gearline.sync.jobs
    dlx-exchange: gearline.dlx
    dlq-name: gearline.sync.dead-letter
    retry-delay-ms: 5000

  # Order polling — how often Reverb and eBay are queried for new orders.
  # Shopify orders arrive via webhook and are NOT polled.
  # Override ORDER_POLL_INTERVAL_MS to adjust (default 10 minutes).
  order-polling:
    interval-ms: ${ORDER_POLL_INTERVAL_MS:600000}      # 10 minutes
    initial-delay-ms: ${ORDER_POLL_INITIAL_DELAY_MS:60000}  # 1 minute after startup

logging:
  level:
    com.gearline: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
