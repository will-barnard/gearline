services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gearline
      POSTGRES_USER: gearline
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - gearline-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearline"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  # ───────────────────────────────────────────────────────────────────────────
  # Schema migrations.
  #
  # These are the SAME .sql files Flyway has always run — moved out of the Java
  # resources tree to ./migrations/ when the Java service was retired. Flyway
  # remains the schema owner; the history in flyway_schema_history carries over
  # untouched, so existing databases continue from V17 rather than re-running.
  #
  # Runs as a one-shot container: it migrates, exits 0, and the backend waits
  # on service_completed_successfully. A failed migration therefore blocks the
  # deploy rather than letting the app start against a half-migrated schema.
  #
  # NOT listed in stateful_services — it must run on every deploy.
  # ───────────────────────────────────────────────────────────────────────────
  flyway:
    image: flyway/flyway:10-alpine
    command: >
      -url=jdbc:postgresql://postgres:5432/gearline
      -user=gearline
      -password=${DB_PASSWORD}
      -connectRetries=10
      -baselineOnMigrate=false
      migrate
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://gearline:${DB_PASSWORD}@postgres:5432/gearline
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET}
      SHOPIFY_FLOW_SECRET: ${SHOPIFY_FLOW_SECRET}
      SHOPIFY_FLOW_TOKEN_HEADER: ${SHOPIFY_FLOW_TOKEN_HEADER}
      REVERB_CLIENT_ID: ${REVERB_CLIENT_ID}
      REVERB_CLIENT_SECRET: ${REVERB_CLIENT_SECRET}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_RU_NAME: ${EBAY_RU_NAME}
      EBAY_NOTIFICATION_VERIFICATION_TOKEN: ${EBAY_NOTIFICATION_VERIFICATION_TOKEN}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      APP_BASE_URL: ${APP_BASE_URL}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      # Never start against an un-migrated schema.
      flyway:
        condition: service_completed_successfully
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  gearline-postgres:
    name: gearline-postgres

networks:
  internal:
