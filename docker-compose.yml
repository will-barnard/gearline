services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gearline
      POSTGRES_USER: gearline
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - gearline-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearline"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  # ───────────────────────────────────────────────────────────────────────────
  # NOTE: there is no separate migration service.
  #
  # The backend runs migrations itself at startup, before it accepts traffic
  # (src/db/migrate.ts). It reads the same ./migrations/*.sql files and the same
  # flyway_schema_history table, using Flyway's own checksum algorithm — so the
  # V1–V17 history written by the Java service is recognised and not re-run, and
  # real Flyway would still validate this database cleanly.
  #
  # The `flyway/flyway` image was the obvious choice but is ~1 GB: it bundles
  # JDBC drivers for Databricks, Snowflake, Oracle, DB2 and more. On a 20 GB VM
  # pulling it filled the disk. A few hundred lines in the container that
  # already exists costs nothing.
  #
  # Concurrent boots (Beachhead's blue/green swap) are serialised with a
  # Postgres advisory lock.
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://gearline:${DB_PASSWORD}@postgres:5432/gearline
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET}
      SHOPIFY_FLOW_SECRET: ${SHOPIFY_FLOW_SECRET}
      SHOPIFY_FLOW_TOKEN_HEADER: ${SHOPIFY_FLOW_TOKEN_HEADER}
      REVERB_CLIENT_ID: ${REVERB_CLIENT_ID}
      REVERB_CLIENT_SECRET: ${REVERB_CLIENT_SECRET}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_RU_NAME: ${EBAY_RU_NAME}
      EBAY_NOTIFICATION_VERIFICATION_TOKEN: ${EBAY_NOTIFICATION_VERIFICATION_TOKEN}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      APP_BASE_URL: ${APP_BASE_URL}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  gearline-postgres:
    name: gearline-postgres

networks:
  internal:
